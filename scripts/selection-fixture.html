<!doctype html>
<html lang="zh"><meta charset="utf-8"><title>浮译选区验证</title>
<style>body{font:18px system-ui;max-width:760px;margin:70px auto;background:#f7f9f3;color:#263c31}textarea,[contenteditable],input{display:block;box-sizing:border-box;width:100%;padding:18px;margin:15px 0 30px;font:20px system-ui;background:white;border:1px solid #b8c9b9;border-radius:12px}textarea{height:120px}label{font-weight:600}[contenteditable]{min-height:80px}</style>
<h1>浮译选区验证</h1><p>本地测试页，不连接网络、不提交内容。</p>
<label for="native">普通输入框</label>
<textarea id="native">保留🌿 | 你好，世界！ | 不动</textarea>
<label id="rich-label">网页富文本输入框</label>
<div role="textbox" aria-labelledby="rich-label" contenteditable="true">保留🌿 | 你好，世界！ | 不动</div>
<label for="other">另一个输入框</label><input id="other" value="不要替换这里">
<p>只读选区：Good design makes complex things feel simple.</p>
<label for="secret">受保护输入框（测试内容）</label><input type="password" id="secret" value="test-only">
</html>
